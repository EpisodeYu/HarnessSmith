[project]
name = "harnessmith"
version = "0.1.0"
description = "Forge your own agent harness — a config-to-code generator with no agent-framework lock-in."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EpisodeYu" }]
keywords = [
    "agent",
    "agent-harness",
    "llm",
    "code-generator",
    "scaffolding",
    "function-calling",
    "openai",
    "anthropic",
    "mcp",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.12",
    "jinja2>=3.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    # Powers the interactive `harnessmith new` setup wizard (the terminal twin of
    # the web form). Generator-side only — it never ships into a generated product
    # (products render their own pyproject), so the "thin product" rule is intact.
    "questionary>=2.0",
]

# Shown in the PyPI "Project links" sidebar — the standard way a published package
# points back at its source/issues. Repo per docs/00-overview §6.
[project.urls]
Homepage = "https://github.com/EpisodeYu/HarnessSmith"
Repository = "https://github.com/EpisodeYu/HarnessSmith"
Issues = "https://github.com/EpisodeYu/HarnessSmith/issues"

[project.optional-dependencies]
# The wizard (Slice 7) is a generator-side tool only; FastAPI/uvicorn live here,
# NOT in the core `dependencies`, so `uvx harnessmith new` and the generated
# product stay free of them.
wizard = ["fastapi>=0.110", "uvicorn>=0.29"]
# `dev` adds the wizard deps + httpx so the test suite can drive the wizard via
# fastapi.testclient.
dev = ["pytest>=8.0", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.scripts]
harnessmith = "harnessmith.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harnessmith"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not golden'"
markers = [
    "golden: slow end-to-end generation tests (uv lock/sync + pytest in the generated repo)",
    "docker: requires a working Docker daemon",
]
filterwarnings = [
    # Upstream transitional notice from starlette's TestClient (httpx<2); not ours.
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
