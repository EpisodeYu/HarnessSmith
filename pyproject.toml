[project]
name = "harnessforge"
version = "0.1.0"
description = "Forge your own agent harness — a config-to-code generator with no agent-framework lock-in."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EpisodeYu" }]
dependencies = [
    "typer>=0.12",
    "jinja2>=3.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
harnessforge = "harnessforge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harnessforge"]

[tool.hatch.build.targets.wheel.force-include]
"harnessforge/templates" = "harnessforge/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
