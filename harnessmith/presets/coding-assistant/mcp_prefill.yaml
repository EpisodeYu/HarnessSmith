# Generation-time MCP prefill for the coding-assistant preset.
#
# NOT part of HarnessSpec / its snapshot: this only lists which catalog servers
# to write into the generated repo's runtime config.yaml (mcp.servers + the tool
# allowlist). Each server is prefilled with a `<server>__*` wildcard that enables
# its whole toolset by default (read + mutating/shell); per-tool risk still comes
# from the catalog (`safe_tools` -> safe, the rest high). Edit config.yaml after
# generation to narrow the allowlist (replace a wildcard with explicit tools).
servers:
  - fetch
  - ddg-search
  - git
  - desktop-commander
