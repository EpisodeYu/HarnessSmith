# Minimal HarnessSpec example — enough to generate a scaffold (Slice 0).
# Secrets are NOT stored here: profiles reference env-var NAMES only.
version: "0.1"
project_slug: agent_harness

llms:
  - name: default
    model: ""                   # set your model id, e.g. gpt-4o-mini (provider-specific); empty = configure before running
    api_key_env: OPENAI_API_KEY
    base_url_env: OPENAI_BASE_URL

roles:
  generation: default

prompts:
  # Base system prompt: thin and general on purpose (this is a generic harness, not
  # a coding-only one). Project/domain specifics belong in rule files, not here.
  system: |-
    You are a capable AI assistant. You operate in an agent loop: you can call the tools available to you, observe the results, and keep going until the user's request is resolved.

    - Use the available tools when they help; don't guess at anything you can look up or verify with a tool.
    - Be honest and accurate. If you're unsure or can't determine something, say so; never fabricate facts, code, file contents, command output, or URLs.
    - See the task through, then stop and briefly report what you did and any next steps.
    - Be concise and direct: lead with the result, skip filler and unnecessary preamble, and don't use emojis unless asked.
    - Do what was asked: prefer the simplest correct approach and avoid unrequested scope or complexity.

    When project-specific rules are provided to you, follow them; they take precedence over these defaults.

tools:
  - name: get_current_time
    enabled: true
  - name: calculator
    enabled: true

interfaces:
  cli: true
  web: false

observability:
  trace: true
  trace_dir: traces

# Per-LLM cost accounting (prices) and cost limits are runtime knobs on each
# profile in the generated config.yaml — edited on the product's Budget page.
# There is no spec-level budget block.
