# Minimal HarnessSpec example — enough to generate a scaffold (Slice 0).
# Secrets are NOT stored here: profiles reference env-var NAMES only.
version: "0.1"
project_slug: agent_harness

llms:
  - name: default
    model: gpt-4o-mini
    api_key_env: OPENAI_API_KEY
    base_url_env: OPENAI_BASE_URL

roles:
  generation: default

prompts:
  system: "You are a helpful assistant."

tools:
  - name: get_current_time
    enabled: true
  - name: calculator
    enabled: true

interfaces:
  cli: true
  web: false

observability:
  trace: true
  trace_dir: traces

budget:
  # Per-run guardrails as named conditions combined by `combine` (or/and). A bare
  # number is a cumulative threshold; add `window_seconds` to make it a rate.
  conditions:
    max_steps: 8
