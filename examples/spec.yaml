# Minimal HarnessSpec example — enough to generate a scaffold (Slice 0).
# Secrets are NOT stored here: profiles reference env-var NAMES only.
version: "0.1"
project_slug: agent_harness

llms:
  - name: default
    model: ""                   # set your model id, e.g. gpt-4o-mini (provider-specific); empty = configure before running
    api_key_env: OPENAI_API_KEY
    base_url_env: OPENAI_BASE_URL

roles:
  generation: default

prompts:
  system: "You are a helpful assistant."

tools:
  - name: get_current_time
    enabled: true
  - name: calculator
    enabled: true

interfaces:
  cli: true
  web: false

observability:
  trace: true
  trace_dir: traces

# Per-LLM cost accounting (prices) and cost limits are runtime knobs on each
# profile in the generated config.yaml — edited on the product's Budget page.
# There is no spec-level budget block.
