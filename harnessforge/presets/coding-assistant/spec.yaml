# coding-assistant preset — a runnable agent harness with a real capability
# baseline (HarnessForge Slice 6). Beyond the two safe built-in demo tools it
# turns on MCP (`mcp.enabled: true`) and prefills the catalog baseline into
# config.yaml: `fetch` + `git` read tools on, mutating git + Desktop Commander
# predefined but off. The baseline servers land in config.yaml (runtime), NOT in
# this spec — see presets/coding-assistant/mcp_prefill.yaml.
version: "0.1"
project_slug: coding_assistant

llms:
  - name: default
    model: ""                   # set your model id, e.g. gpt-4o-mini (provider-specific); empty = configure before running
    api_key_env: OPENAI_API_KEY
    base_url_env: OPENAI_BASE_URL

roles:
  generation: default

prompts:
  system: |-
    You are a focused coding assistant. You work in an agent loop: use the available tools to inspect the codebase, run commands, and make changes, verifying your work until the task is done.

    - Use tools rather than guessing; read the relevant code before changing it.
    - Be honest and accurate; never fabricate file contents, APIs, command output, or results you haven't verified.
    - Make the smallest correct change: fix the root cause, match the existing style, and don't refactor or expand scope beyond what was asked.
    - Be concise and direct: lead with the result and skip filler.

    When project rules are provided to you, follow them; they take precedence over these defaults.
  # Always-apply project rules (AGENTS.md/CLAUDE.md/.cursor-rules pattern): a
  # starter RULES.md is generated and injected into every system prompt. Edit it
  # or list more files at runtime in config.yaml — no regeneration needed.
  rules_files:
    - RULES.md

tools:
  - name: get_current_time
    enabled: true
  - name: calculator
    enabled: true

interfaces:
  cli: true
  web: false

mcp:
  enabled: true

observability:
  trace: true
  trace_dir: traces

# Per-LLM cost accounting (prices) and cost limits are runtime knobs on each
# profile in the generated config.yaml — edited on the product's Budget page.
# There is no spec-level budget block.
