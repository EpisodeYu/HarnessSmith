# coding-assistant preset — a runnable agent harness with a real capability
# baseline (HarnessForge Slice 6). Beyond the two safe built-in demo tools it
# turns on MCP (`mcp.enabled: true`) and prefills the catalog baseline into
# config.yaml: `fetch` + `git` read tools on, mutating git + Desktop Commander
# predefined but off. The baseline servers land in config.yaml (runtime), NOT in
# this spec — see presets/coding-assistant/mcp_prefill.yaml.
version: "0.1"
project_slug: coding_assistant

llms:
  - name: default
    model: gpt-4o-mini
    api_key_env: OPENAI_API_KEY
    base_url_env: OPENAI_BASE_URL

roles:
  generation: default

prompts:
  system: >-
    You are a focused coding assistant. Think step by step, use the available
    tools when they help, and keep answers concise.
  # Always-apply project rules (AGENTS.md/CLAUDE.md/.cursor-rules pattern): a
  # starter RULES.md is generated and injected into every system prompt. Edit it
  # or list more files at runtime in config.yaml — no regeneration needed.
  rules_files:
    - RULES.md

tools:
  - name: get_current_time
    enabled: true
  - name: calculator
    enabled: true

interfaces:
  cli: true
  web: false

mcp:
  enabled: true

observability:
  trace: true
  trace_dir: traces

budget:
  max_steps: 8
