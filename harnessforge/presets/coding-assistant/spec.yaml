# coding-assistant preset — a minimal, runnable agent harness (HarnessForge L1).
# Generates a thin function-calling loop with two safe built-in tools.
version: "0.1"
project_slug: coding_assistant

llms:
  - name: default
    model: gpt-4o-mini
    api_key_env: OPENAI_API_KEY
    base_url_env: OPENAI_BASE_URL

roles:
  generation: default

prompts:
  system: >-
    You are a focused coding assistant. Think step by step, use the available
    tools when they help, and keep answers concise.

tools:
  - name: get_current_time
    enabled: true
  - name: calculator
    enabled: true

interfaces:
  cli: true
  web: false

observability:
  trace: true
  trace_dir: traces

budget:
  max_steps: 8
